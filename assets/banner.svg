<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="Pedro Carvalho: Coordenador de TI. Saúde Digital, Ciência de Dados e NLP">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4f91"/><stop offset="0.6" stop-color="#3b86c9"/><stop offset="1" stop-color="#8cc9ee"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a6"/><stop offset="0.45" stop-color="#f9c846"/><stop offset="1" stop-color="#c98a12"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5629"/><stop offset="1" stop-color="#4e2d14"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bfc9"/><stop offset="1" stop-color="#6f7787"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc23a"/><stop offset="1" stop-color="#4c8f21"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f78d1"/><stop offset="1" stop-color="#1b3b82"/>
    </linearGradient>
    <linearGradient id="elixir" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a3ff"/><stop offset="1" stop-color="#b01fc9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#fff7c2" stop-opacity="0.85"/><stop offset="1" stop-color="#fff7c2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="wall" width="40" height="44" patternUnits="userSpaceOnUse" x="0" y="262">
      <path d="M0 14H8V0H32V14H40V44H0Z" fill="url(#stone)" stroke="#3d4452" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 30H40M20 30V44" stroke="#3d4452" stroke-width="1.4" fill="none" opacity="0.7"/>
    </pattern>
    <pattern id="turf" width="60" height="24" patternUnits="userSpaceOnUse">
      <rect width="30" height="24" fill="#000" fill-opacity="0.06"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0a1633" flood-opacity="0.55"/>
    </filter>
    <clipPath id="r"><rect width="1200" height="350" rx="20"/></clipPath>
    <path id="drop" d="M0,-20 C10,-6 15,3 15,10 A15,15 0 0 1 -15,10 C-15,3 -10,-6 0,-20Z"/>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1200" height="350" fill="url(#sky)"/>
    <rect width="1200" height="350" fill="url(#sun)"/>

    <!-- nuvens -->
    <g fill="#ffffff" fill-opacity="0.85">
      <g>
        <ellipse cx="260" cy="60" rx="52" ry="16"/><ellipse cx="292" cy="48" rx="34" ry="16"/><ellipse cx="228" cy="52" rx="28" ry="12"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;50 0;0 0" dur="24s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="700" cy="36" rx="60" ry="17"/><ellipse cx="735" cy="24" rx="36" ry="16"/><ellipse cx="664" cy="30" rx="30" ry="12"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="30s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="1090" cy="86" rx="46" ry="13"/><ellipse cx="1116" cy="76" rx="28" ry="13"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-40 0;0 0" dur="26s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- colinas e gramado -->
    <path d="M0 262 Q150 214 320 244 T640 236 T960 242 T1200 226 V300 H0Z" fill="#3f8a2a" fill-opacity="0.75"/>
    <rect y="290" width="1200" height="60" fill="url(#grass)"/>
    <rect y="290" width="1200" height="60" fill="url(#turf)"/>

    <!-- muralha -->
    <rect x="0" y="262" width="1200" height="44" fill="url(#wall)"/>
    <rect x="0" y="304" width="1200" height="4" fill="#2b2f3a" fill-opacity="0.5"/>

    <!-- brasão: escudo com cruz e espadas -->
    <g transform="translate(985,138)" filter="url(#sh)">
      <animateTransform attributeName="transform" type="translate" values="985 138;985 128;985 138" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
      <g transform="rotate(-58)"><rect x="-6" y="-112" width="12" height="190" rx="4" fill="url(#stone)" stroke="#3d4452" stroke-width="2"/><rect x="-26" y="52" width="52" height="10" rx="4" fill="url(#gold)" stroke="#8a5a0a" stroke-width="2"/><rect x="-6" y="60" width="12" height="26" rx="4" fill="url(#wood)" stroke="#2f1a0a" stroke-width="2"/></g>
      <g transform="rotate(58)"><rect x="-6" y="-112" width="12" height="190" rx="4" fill="url(#stone)" stroke="#3d4452" stroke-width="2"/><rect x="-26" y="52" width="52" height="10" rx="4" fill="url(#gold)" stroke="#8a5a0a" stroke-width="2"/><rect x="-6" y="60" width="12" height="26" rx="4" fill="url(#wood)" stroke="#2f1a0a" stroke-width="2"/></g>
      <path d="M0,-86 L66,-68 V8 C66,56 30,84 0,102 C-30,84 -66,56 -66,8 V-68 Z" fill="url(#shield)" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
      <path d="M0,-86 L66,-68 V8 C66,56 30,84 0,102 C-30,84 -66,56 -66,8 V-68 Z" fill="none" stroke="#7a4d08" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-14,-44 H14 V-14 H44 V14 H14 V44 H-14 V14 H-44 V-14 H-14Z" fill="#ffffff" stroke="#16306b" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-30,0 H-12 L-6,-14 L2,16 L8,0 H30" fill="none" stroke="#e11d48" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- recursos -->
    <g transform="translate(1100,236)">
      <use href="#drop" fill="url(#elixir)" stroke="#5b0f6b" stroke-width="2.5"/>
      <ellipse cx="-5" cy="2" rx="3" ry="5" fill="#fff" fill-opacity="0.55"/>
      <animateTransform attributeName="transform" type="translate" values="1100 236;1100 228;1100 236" dur="3s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(870,238)">
      <circle r="15" fill="url(#gold)" stroke="#8a5a0a" stroke-width="2.5"/>
      <circle r="9" fill="none" stroke="#b97c0c" stroke-width="2"/>
      <animateTransform attributeName="transform" type="translate" values="870 238;870 230;870 238" dur="3.6s" repeatCount="indefinite"/>
    </g>

    <!-- brilhos -->
    <g fill="#fff7c2">
      <path d="M1075 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M905 112 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.8s" repeatCount="indefinite"/></path>
    </g>

    <!-- faixa do cargo -->
    <g filter="url(#sh)">
      <path d="M52,34 H292 L308,52 L292,70 H52 Z" fill="url(#gold)" stroke="#7a4d08" stroke-width="3" stroke-linejoin="round"/>
      <text x="72" y="59" font-family="Impact,'Arial Black','Segoe UI',sans-serif" font-size="20" fill="#4a2a06" letter-spacing="2.5">COORDENADOR DE TI</text>
    </g>

    <!-- nome -->
    <text x="60" y="146" font-family="Impact,'Arial Black','Segoe UI',sans-serif" font-size="78" fill="#ffffff" stroke="#10224a" stroke-width="12" stroke-linejoin="round" paint-order="stroke" letter-spacing="1">Pedro Carvalho</text>
    <text x="62" y="186" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" stroke="#10224a" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Saúde Digital  ·  Ciência de Dados  ·  NLP aplicado à saúde</text>

    <!-- chips de madeira -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" filter="url(#sh)">
      <rect x="62" y="206" width="160" height="32" rx="9" fill="url(#wood)" stroke="url(#gold)" stroke-width="2.5"/>
      <text x="142" y="227" text-anchor="middle" fill="#fff3a6">PROASPI · FUNATI</text>
      <rect x="234" y="206" width="196" height="32" rx="9" fill="url(#wood)" stroke="url(#gold)" stroke-width="2.5"/>
      <text x="332" y="227" text-anchor="middle" fill="#fff3a6">Núcleo de Telessaúde</text>
      <rect x="442" y="206" width="170" height="32" rx="9" fill="url(#wood)" stroke="url(#gold)" stroke-width="2.5"/>
      <text x="527" y="227" text-anchor="middle" fill="#fff3a6">Especialista · UEA</text>
    </g>
  </g>
  <rect x="2" y="2" width="1196" height="346" rx="19" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <rect x="5" y="5" width="1190" height="340" rx="17" fill="none" stroke="#5a3608" stroke-opacity="0.7" stroke-width="1.5"/>
</svg>
