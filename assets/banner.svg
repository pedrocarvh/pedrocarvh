<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="Pedro Carvalho: Coordenador de TI. Saúde Digital, Ciência de Dados e NLP">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4f91"/><stop offset="0.6" stop-color="#3b86c9"/><stop offset="1" stop-color="#8cc9ee"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a6"/><stop offset="0.45" stop-color="#f9c846"/><stop offset="1" stop-color="#c98a12"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5629"/><stop offset="1" stop-color="#4e2d14"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bfc9"/><stop offset="1" stop-color="#6f7787"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc23a"/><stop offset="1" stop-color="#4c8f21"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f78d1"/><stop offset="1" stop-color="#1b3b82"/>
    </linearGradient>
    <linearGradient id="elixir" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a3ff"/><stop offset="1" stop-color="#b01fc9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#fff7c2" stop-opacity="0.85"/><stop offset="1" stop-color="#fff7c2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="wall" width="40" height="44" patternUnits="userSpaceOnUse" x="0" y="262">
      <path d="M0 14H8V0H32V14H40V44H0Z" fill="url(#stone)" stroke="#3d4452" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 30H40M20 30V44" stroke="#3d4452" stroke-width="1.4" fill="none" opacity="0.7"/>
    </pattern>
    <pattern id="turf" width="60" height="24" patternUnits="userSpaceOnUse">
      <rect width="30" height="24" fill="#000" fill-opacity="0.06"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0a1633" flood-opacity="0.55"/>
    </filter>
    <clipPath id="r"><rect width="1200" height="350" rx="20"/></clipPath>
    <path id="drop" d="M0,-20 C10,-6 15,3 15,10 A15,15 0 0 1 -15,10 C-15,3 -10,-6 0,-20Z"/>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1200" height="350" fill="url(#sky)"/>
    <rect width="1200" height="350" fill="url(#sun)"/>

    <!-- nuvens -->
    <g fill="#ffffff" fill-opacity="0.85">
      <g>
        <ellipse cx="260" cy="60" rx="52" ry="16"/><ellipse cx="292" cy="48" rx="34" ry="16"/><ellipse cx="228" cy="52" rx="28" ry="12"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;50 0;0 0" dur="24s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="700" cy="36" rx="60" ry="17"/><ellipse cx="735" cy="24" rx="36" ry="16"/><ellipse cx="664" cy="30" rx="30" ry="12"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="30s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="1090" cy="86" rx="46" ry="13"/><ellipse cx="1116" cy="76" rx="28" ry="13"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-40 0;0 0" dur="26s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- colinas e gramado -->
    <path d="M0 262 Q150 214 320 244 T640 236 T960 242 T1200 226 V300 H0Z" fill="#3f8a2a" fill-opacity="0.75"/>
    <rect y="290" width="1200" height="60" fill="url(#grass)"/>
    <rect y="290" width="1200" height="60" fill="url(#turf)"/>


    <!-- personagens (atrás da muralha) -->
    <g stroke="#4a2a0c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <!-- Bárbaro -->
      <g transform="translate(830,212)">
        <animateTransform attributeName="transform" type="translate" values="830 214;830 206;830 214" dur="2.2s" repeatCount="indefinite"/>
        <path d="M-46,70 Q-50,34 -28,28 H28 Q50,34 46,70Z" fill="#b9763a"/>
        <path d="M-22,28 L-8,70 M22,28 L8,70" fill="none" stroke="#6b3d14"/>
        <circle cx="-44" cy="4" r="9" fill="#f4b886"/><circle cx="44" cy="4" r="9" fill="#f4b886"/>
        <ellipse cx="0" cy="0" rx="45" ry="43" fill="#f4b886"/>
        <path d="M-47,-6 Q-54,-46 -22,-52 Q0,-74 22,-52 Q54,-46 47,-6 Q38,-28 0,-30 Q-38,-28 -47,-6Z" fill="#f9d23c"/>
        <path d="M-32,-10 L-7,-1 L-8,5 L-34,-3Z M32,-10 L7,-1 L8,5 L34,-3Z" fill="#5a3410"/>
        <circle cx="-17" cy="7" r="6" fill="#fff"/><circle cx="17" cy="7" r="6" fill="#fff"/>
        <circle cx="-15" cy="8" r="2.8" fill="#1a0f06" stroke="none"/><circle cx="15" cy="8" r="2.8" fill="#1a0f06" stroke="none"/>
        <ellipse cx="0" cy="38" rx="11" ry="8" fill="#7a1f1a"/>
        <path d="M0,16 Q-10,9 -25,15 Q-44,17 -46,34 Q-33,26 -15,28 Q-6,28 0,24 Q6,28 15,28 Q33,26 46,34 Q44,17 25,15 Q10,9 0,16Z" fill="#f9d23c"/>
      </g>
      <!-- Arqueira -->
      <g transform="translate(960,212)">
        <animateTransform attributeName="transform" type="translate" values="960 212;960 204;960 212" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
        <path d="M-44,70 Q-46,34 -26,28 H26 Q46,34 44,70Z" fill="#3a9a46"/>
        <circle cx="0" cy="-2" r="52" fill="#43b04a"/>
        <path d="M-50,-2 Q-60,40 -40,54 Q-38,26 -34,10Z M50,-2 Q60,40 40,54 Q38,26 34,10Z" fill="#ec5b9c"/>
        <ellipse cx="0" cy="2" rx="37" ry="38" fill="#fbd7b0"/>
        <path d="M-40,-4 Q-34,-40 0,-42 Q34,-40 40,-4 Q22,-24 0,-22 Q-22,-24 -40,-4Z" fill="#ec5b9c"/>
        <ellipse cx="-14" cy="8" rx="7" ry="9" fill="#fff"/><ellipse cx="14" cy="8" rx="7" ry="9" fill="#fff"/>
        <circle cx="-13" cy="10" r="4.4" fill="#1d2a6b" stroke="none"/><circle cx="15" cy="10" r="4.4" fill="#1d2a6b" stroke="none"/>
        <circle cx="-11.5" cy="8" r="1.5" fill="#fff" stroke="none"/><circle cx="16.5" cy="8" r="1.5" fill="#fff" stroke="none"/>
        <ellipse cx="-26" cy="24" rx="6" ry="4" fill="#f58aa8" stroke="none" fill-opacity="0.7"/><ellipse cx="26" cy="24" rx="6" ry="4" fill="#f58aa8" stroke="none" fill-opacity="0.7"/>
        <path d="M-9,28 Q0,36 9,28" fill="none"/>
      </g>
      <!-- Goblin -->
      <g transform="translate(1090,212)">
        <animateTransform attributeName="transform" type="translate" values="1090 214;1090 206;1090 214" dur="2s" begin="0.9s" repeatCount="indefinite"/>
        <path d="M-40,70 Q-44,36 -24,30 H24 Q44,36 40,70Z" fill="#8a5a2a"/>
        <path d="M-40,-2 L-92,-26 L-46,22Z M40,-2 L92,-26 L46,22Z" fill="#6fc03a"/>
        <ellipse cx="0" cy="0" rx="42" ry="38" fill="#6fc03a"/>
        <path d="M-32,-12 L-8,-4 L-9,2 L-34,-6Z M32,-12 L8,-4 L9,2 L34,-6Z" fill="#2f5d14"/>
        <ellipse cx="-17" cy="3" rx="8" ry="7" fill="#fff6a8"/><ellipse cx="17" cy="3" rx="8" ry="7" fill="#fff6a8"/>
        <circle cx="-15" cy="4" r="3.2" fill="#1a0f06" stroke="none"/><circle cx="15" cy="4" r="3.2" fill="#1a0f06" stroke="none"/>
        <ellipse cx="0" cy="14" rx="9" ry="12" fill="#4e9a22"/>
        <path d="M-26,26 Q0,48 26,26 Q0,34 -26,26Z" fill="#5a1410"/>
        <path d="M-12,29 L-8,37 L-4,31Z M4,31 L8,37 L12,29Z" fill="#fff" stroke="none"/>
      </g>
    </g>

    <!-- muralha em primeiro plano -->
    <rect x="0" y="262" width="1200" height="44" fill="url(#wall)"/>
    <rect x="0" y="304" width="1200" height="4" fill="#2b2f3a" fill-opacity="0.5"/>

    <!-- barra de recursos estilo jogo -->
    <g font-family="Impact,'Arial Black','Segoe UI',sans-serif" font-size="17" fill="#fff" stroke="#10224a" stroke-width="4" paint-order="stroke" stroke-linejoin="round" filter="url(#sh)">
      <g transform="translate(745,22)">
        <rect width="138" height="30" rx="15" fill="#0f1c3d" fill-opacity="0.82" stroke="url(#gold)" stroke-width="2"/>
        <circle cx="16" cy="15" r="13" fill="url(#gold)" stroke="#8a5a0a" stroke-width="2"/><circle cx="16" cy="15" r="7" fill="none" stroke="#b97c0c" stroke-width="1.6"/>
        <text x="36" y="22">Café ∞</text>
      </g>
      <g transform="translate(895,22)">
        <rect width="138" height="30" rx="15" fill="#0f1c3d" fill-opacity="0.82" stroke="url(#gold)" stroke-width="2"/>
        <g transform="translate(16,15) scale(0.8)"><use href="#drop" fill="url(#elixir)" stroke="#5b0f6b" stroke-width="2.5"/></g>
        <text x="36" y="22">Dados</text>
      </g>
      <g transform="translate(1045,22)">
        <rect width="138" height="30" rx="15" fill="#0f1c3d" fill-opacity="0.82" stroke="url(#gold)" stroke-width="2"/>
        <g transform="translate(16,15) scale(0.8)"><use href="#drop" fill="#3a2a4a" stroke="#120818" stroke-width="2.5"/></g>
        <text x="36" y="22">NLP</text>
      </g>
    </g>

    <!-- brilhos -->
    <g fill="#fff7c2">
      <path d="M1075 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M905 112 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.8s" repeatCount="indefinite"/></path>
    </g>

    <!-- faixa do cargo -->
    <g filter="url(#sh)">
      <path d="M52,34 H292 L308,52 L292,70 H52 Z" fill="url(#gold)" stroke="#7a4d08" stroke-width="3" stroke-linejoin="round"/>
      <text x="72" y="59" font-family="Impact,'Arial Black','Segoe UI',sans-serif" font-size="20" fill="#4a2a06" letter-spacing="2.5">COORDENADOR DE TI</text>
    </g>

    <!-- estrela de nível -->
    <g transform="translate(318,52)" filter="url(#sh)">
      <path d="M0,-26 L7.6,-9 L26,-8 L12,4.6 L16.2,22 L0,13 L-16.2,22 L-12,4.6 L-26,-8 L-7.6,-9Z" fill="#3b82f6" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <text y="7" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="17" fill="#fff" stroke="#10224a" stroke-width="3.5" paint-order="stroke">TI</text>
    </g>

    <!-- nome -->
    <text x="60" y="146" font-family="Impact,'Arial Black','Segoe UI',sans-serif" font-size="78" fill="#ffffff" stroke="#10224a" stroke-width="12" stroke-linejoin="round" paint-order="stroke" letter-spacing="1">Pedro Carvalho</text>
    <text x="62" y="186" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" stroke="#10224a" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Saúde Digital  ·  Ciência de Dados  ·  NLP aplicado à saúde</text>

    <!-- chips de madeira -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" filter="url(#sh)">
      <rect x="62" y="206" width="160" height="32" rx="9" fill="url(#wood)" stroke="url(#gold)" stroke-width="2.5"/>
      <text x="142" y="227" text-anchor="middle" fill="#fff3a6">PROASPI · FUNATI</text>
      <rect x="234" y="206" width="196" height="32" rx="9" fill="url(#wood)" stroke="url(#gold)" stroke-width="2.5"/>
      <text x="332" y="227" text-anchor="middle" fill="#fff3a6">Núcleo de Telessaúde</text>
      <rect x="442" y="206" width="170" height="32" rx="9" fill="url(#wood)" stroke="url(#gold)" stroke-width="2.5"/>
      <text x="527" y="227" text-anchor="middle" fill="#fff3a6">Especialista · UEA</text>
    </g>
  </g>
  <rect x="2" y="2" width="1196" height="346" rx="19" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <rect x="5" y="5" width="1190" height="340" rx="17" fill="none" stroke="#5a3608" stroke-opacity="0.7" stroke-width="1.5"/>
</svg>
