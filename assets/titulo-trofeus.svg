<svg xmlns="http://www.w3.org/2000/svg" width="900" height="76" viewBox="0 0 900 76" role="img" aria-label="Troféus &amp; Estatísticas">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a6"/><stop offset="0.45" stop-color="#f9c846"/><stop offset="1" stop-color="#c98a12"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f5a2b"/><stop offset="1" stop-color="#4b2a12"/></linearGradient>
    <pattern id="grain" width="120" height="8" patternUnits="userSpaceOnUse"><path d="M0 4 Q30 1 60 4 T120 4" fill="none" stroke="#2f1a0a" stroke-opacity="0.35" stroke-width="1.2"/></pattern>
    <filter id="sh" x="-5%" y="-20%" width="110%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#050b1c" flood-opacity="0.55"/></filter>
  </defs>
  <g filter="url(#sh)">
    <rect x="12" y="12" width="876" height="52" rx="12" fill="url(#wood)" stroke="url(#gold)" stroke-width="4"/>
    <rect x="16" y="16" width="868" height="44" rx="9" fill="url(#grain)"/>
    <circle cx="30" cy="38" r="4" fill="url(#gold)" stroke="#7a4d08"/><circle cx="870" cy="38" r="4" fill="url(#gold)" stroke="#7a4d08"/>
  </g>
  <text x="104" y="50" font-family="Impact,'Arial Black','Segoe UI',sans-serif" font-size="30" fill="#ffffff" stroke="#2a1405" stroke-width="6" paint-order="stroke" stroke-linejoin="round" letter-spacing="0.8">Troféus &amp; Estatísticas</text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.6s" repeatCount="indefinite"/>
    <image href="data:image/webp;base64," x="8" y="-22" width="112" height="112"/>
  </g>
</svg>
